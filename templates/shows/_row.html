{% if shows %}
<section class="row"{% if anchor %} id="{{ anchor }}"{% endif %}>
    <div class="row-head">
        <h2 class="row-title">{{ title }}</h2>
        {% if subtitle %}<p class="row-subtitle">{{ subtitle }}</p>{% endif %}
    </div>
    <div class="row-scroller">
        {% for show in shows %}
        {% include "shows/_card.html" %}
        {% endfor %}
    </div>
</section>
{% endif %}
