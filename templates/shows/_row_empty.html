<section class="row">
    <div class="row-head">
        <h2 class="row-title">{{ title }}</h2>
        {% if subtitle %}<p class="row-subtitle">{{ subtitle }}</p>{% endif %}
    </div>
    <div class="row-empty">
        <p>{{ message }}</p>
        {% if needed %}<p class="row-progress">{{ have }} of {{ needed }} logged</p>{% endif %}
        {% if cta_label and cta_url %}<a href="{{ cta_url }}" class="empty-cta">{{ cta_label }} →</a>{% endif %}
    </div>
</section>
