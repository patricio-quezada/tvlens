# Fly.io settings for the TVLens app. Deploy with `fly deploy` from this folder.
app = "tvlens"
primary_region = "iad"

[build]

[env]
  # The database lives on the volume mounted at /data, so it survives deploys
  # and restarts. Everything else in the image is replaced on every deploy.
  DB_NAME = "/data/db.sqlite3"
  # tvlens.org is the app (since Day 80, Oct 21 2026). Cloudflare proxies it
  # here, except the 80dp build log, which a Worker serves from Pages.
  # app.tvlens.org still resolves straight to Fly, and only redirects to
  # tvlens.org (it stays reachable so the nightly job can wake the machine).
  ALLOWED_HOSTS = "tvlens.org,app.tvlens.org,tvlens.fly.dev"
  CSRF_TRUSTED_ORIGINS = "https://tvlens.org,https://app.tvlens.org,https://tvlens.fly.dev"
  CANONICAL_HOST = "tvlens.org"
  REDIRECT_HOSTS = "app.tvlens.org"
  # Fly's proxy ends HTTPS and tells the app so in X-Forwarded-Proto.
  TRUST_PROXY_SSL_HEADER = "True"
  # Password reset mail goes through iCloud custom domain mail. The Apple ID
  # and its app-specific password are Fly secrets (EMAIL_HOST_USER and
  # EMAIL_HOST_PASSWORD).
  EMAIL_BACKEND = "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST = "smtp.mail.me.com"
  EMAIL_PORT = "587"
  EMAIL_USE_SSL = "False"
  EMAIL_USE_TLS = "True"
  DEFAULT_FROM_EMAIL = "support@tvlens.org"

[mounts]
  source = "tvlens_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Stops the machine when nobody is visiting and starts it on the next
  # request, so an idle month costs little. The first visit after a stop
  # waits a second or two.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Fly stops sending visitors to the machine while this fails. It asks
# /healthz, which skips the database. The headers make the request look like
# a visitor's: the app only answers its own hostnames, and redirects anything
# not marked as HTTPS.
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
  [http_service.checks.headers]
    Host = "tvlens.org"
    X-Forwarded-Proto = "https"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
