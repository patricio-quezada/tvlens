# Nightly catalog refresh on the live app (Fly.io, app "tvlens").
#
# The app's machine sleeps when nobody visits, and a sleeping machine runs no
# schedule of its own, so GitHub's clock drives it: wake the machine, keep it
# awake while the job runs, and run refresh_catalog inside it over fly ssh.
# --oldest 10 a night re-hydrates the whole ~250-show catalog about monthly;
# --discover picks up shows that have newly crossed the vote floor.

name: Refresh catalog

on:
  schedule:
    - cron: "15 8 * * *"  # 08:15 UTC, 4:15 a.m. Eastern: nobody is browsing
  workflow_dispatch:      # and a button to run it by hand

concurrency:
  group: refresh-catalog  # never two runs writing to SQLite at once

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wake the machine
        run: curl --silent --show-error --fail --retry 5 --retry-delay 5 -o /dev/null https://app.tvlens.org/

      - name: Refresh, keeping the machine awake meanwhile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Fly stops an idle machine; an SSH session isn't traffic, so a
          # request every 30 seconds keeps it up until the job is done.
          ( while true; do curl --silent -o /dev/null https://app.tvlens.org/; sleep 30; done ) &
          trap 'kill $!' EXIT
          flyctl ssh console -a tvlens -C "python manage.py refresh_catalog --discover --pages 3 --oldest 10"
